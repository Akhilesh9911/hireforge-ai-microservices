# Application Name ? Eureka isse identify karega
spring.application.name=resume-service

# Port
server.port=8082

# Database ?
spring.datasource.url=jdbc:mysql://localhost:3306/hireforge_resume_db?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

## Eureka logs band karo
#logging.level.com.netflix.discovery=ERROR
#logging.level.com.netflix.eureka=ERROR

gemini.api.key=${GEMINI_API_KEY}

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379

spring.cache.redis.time-to-live=86400000